# Secret key template for ~/.config/tdsk/values.yaml (dev) and ~/.config/tdsk/values.<context>.<env>.yaml (prod,
# e.g. values.tdsk.production.yaml). Key NAMES only; values live outside git (password manager backup of ~/.config/tdsk/).
# Load order: deploy/values.yaml -> deploy/values.<env>.yaml -> ~/.config/tdsk/values.yaml -> ~/.config/tdsk/values.<ctx>.<env>.yaml
#
# Legend (comment after each key):
#   [prod]  required to stand up production
#   [ci]    also mirrored as a GitHub Actions secret (.github/workflows/deploy-production.yml)
#   [k8s:<secret>]  consumed by `tdsk kube secret <task>` (repos/cli/src/tasks/kube/secret/) to build that K8s secret
env:
  # ---- Core ----
  TDSK_MASTER_KEY: ""            # [prod][ci][k8s:tdsk-master-key via `tdsk kube secret tdsk`] encrypts the `secrets` table; losing it makes stored secrets unrecoverable
  TDSK_BE_HEADER_VALUE: ""       # [prod] shared header value proxy -> backend
  STL_FORCE_DISABLE_SAFE: ""     # local tooling flag

  # ---- Database (Postgres; Neon when TDSK_DB_TYPE=neon) ----
  TDSK_DB_TYPE: ""               # [prod][k8s:tdsk-db-cfg via `tdsk kube secret database`]
  TDSK_DB_NAME: ""               # [prod][k8s:tdsk-db-cfg]
  TDSK_DB_USER: ""               # [prod][ci][k8s:tdsk-db-cfg]
  TDSK_DB_PASS: ""               # [prod][ci][k8s:tdsk-db-cfg]
  TDSK_DB_URL: ""                # [prod][ci][k8s:tdsk-db-cfg] pooled connection URL
  TDSK_DB_AUTH_URL: ""           # [prod][ci][k8s:tdsk-db-cfg] direct (unpooled) URL; also Caddy cert storage DSN
  TDSK_DB_PROJECT_ID: ""         # [prod][ci][k8s:tdsk-db-cfg] Neon project id
  TDSK_NEON_API_KEY: ""          # Neon console API key (not consumed by repo code)

  # ---- Auth (Neon Auth / Better Auth) ----
  TDSK_AUTH_PROVIDERS: ""        # [prod] e.g. github,google,vercel,email
  TDSK_AUTH_URL: ""              # [prod] Neon Auth base URL (per Neon project; also set in deploy/values*.yaml)
  TDSK_AUTH_JWKS: ""             # [prod] Neon Auth JWKS URL (per Neon project; also set in deploy/values*.yaml)
  TDSK_GH_CLIENT_KEY: ""         # [prod] GitHub OAuth app client id (callback -> Neon Auth host)
  TDSK_GH_CLIENT_SECRET: ""      # [prod]
  TDSK_VER_CLIENT_KEY: ""        # [prod] Vercel OAuth app client id
  TDSK_VER_CLIENT_SECRET: ""     # [prod]
  TDSK_GOOGLE_CLIENT_KEY: ""     # Google OAuth client id
  TDSK_GOOGLE_CLIENT_SECRET: ""

  # ---- Object storage (any S3-compatible store) ----
  TDSK_S3_BUCKET: ""             # [prod][k8s:tdsk-s3-secret via `tdsk kube secret s3`]
  TDSK_S3_ENDPOINT: ""           # [prod][k8s:tdsk-s3-secret]
  TDSK_S3_ACCESS_KEY_ID: ""      # [prod][k8s:tdsk-s3-secret]
  TDSK_S3_SECRET_ACCESS_KEY: ""  # [prod][k8s:tdsk-s3-secret]

  # ---- Payments (Stripe) ----
  TDSK_PAY_TYPE: ""              # [prod][k8s:tdsk-payments-secret via `tdsk kube secret payments`]
  TDSK_PAY_ACCESS_TOKEN: ""      # [prod][ci][k8s:tdsk-payments-secret]
  TDSK_PAY_WEBHOOK_SECRET: ""    # [prod][ci][k8s:tdsk-payments-secret]
  TDSK_PAY_PLANS: ""             # [prod][k8s:tdsk-payments-secret] plan JSON; product/price ids in deploy/infra/stripe.yaml

  # ---- Email ----
  TDSK_EMAIL_TYPE: ""            # [prod][k8s:tdsk-email-secret via `tdsk kube secret email`] resend | mailgun | smtp | console
  TDSK_EMAIL_API_KEY: ""         # [prod][ci][k8s:tdsk-email-secret]
  TDSK_EMAIL_API_HOST: ""        # [prod][k8s:tdsk-email-secret]
  TDSK_EMAIL_FROM: ""            # [prod]
  TDSK_EMAIL_HOST: ""            # [prod][k8s:tdsk-email-secret]
  TDSK_EMAIL_PORT: ""            # [prod][k8s:tdsk-email-secret]
  TDSK_EMAIL_USER: ""
  TDSK_EMAIL_PASS: ""
  TDSK_EMAIL_SECURE: ""

  # ---- Egress MITM CA (files kept as ~/.config/tdsk/domain/egress.cert + egress.key) ----
  TDSK_EGRESS_CA_CERT: ""        # [prod][ci][k8s:tdsk-egress-ca via `tdsk kube secret egress`]
  TDSK_EGRESS_CA_KEY: ""         # [prod][ci][k8s:tdsk-egress-ca]

  # ---- Cluster provider / registry ----
  TDSK_CIVO_API_KEY: ""          # Civo API key (GitHub secret TDSK_CIVO_TOKEN); provider-specific
  GIT_USER: ""                   # [prod][k8s:docker-auth-pull via `tdsk kube secret docker`] ghcr.io pull/push user
  GIT_TOKEN: ""                  # [prod][ci][k8s:docker-auth-pull] ghcr.io PAT
  GIT_FG_PAT: ""                 # fine-grained GitHub PAT

  # ---- Agent fleet git identities ----
  TDSK_GIT_STEWARD_USER: ""
  TDSK_GIT_STEWARD_PASS: ""
  TDSK_GIT_STEWARD_PAT: ""
  TDSK_GIT_ADVERSARY_PAT: ""     # classic `repo` scope PAT

  # ---- LLM providers ----
  TDSK_ANTHROPIC_API_KEY: ""
  TDSK_CLAUDE_CODE_API_KEY: ""
  TDSK_OPENAI_API_KEY: ""
  TDSK_OR_API_KEY: ""            # OpenRouter
  TDSK_GAI_API_KEY: ""           # Google AI
  TDSK_ZAI_API_KEY: ""
  TDSK_DS_API_KEY: ""            # DeepSeek
  TDSK_OLLAMA_API_KEY: ""

  # ---- Publishing / misc tokens ----
  NPM_PUBLISH_TOKEN: ""
  NPM_AUTOMATION_TOKEN: ""
  KEG_HUB_API_KEY: ""
  TDSK_PROJ_API_KEY: ""
  TDSK_THREAD_API_KEY: ""
  WMD_CHECKOUT_TOKEN: ""
  WMN_RELEASES_TOKEN: ""
  TDSK_MONITOR_KEY: ""           # .github/workflows/system-monitor.yml (unset today -> report-only mode)

  # ---- Integration tests (repos/integration) ----
  TDSK_IT_API_KEY: ""
  TDSK_IT_AUTH_URL: ""
  TDSK_IT_ORG_ID: ""
  TDSK_IT_PROJECT_ID: ""
  TDSK_IT_AGENT_ID: ""
  TDSK_IT_ZAI_AGENT_ID: ""
  TDSK_IT_PROVIDER_KEY: ""
  TDSK_IT_SUPER_USER: ""
  TDSK_IT_ADMIN_USER: ""
  TDSK_IT_MEMBER_USER: ""
  TDSK_IT_VIEWER_USER: ""
  TDSK_IT_USER_EMAIL: ""
  TDSK_IT_USER_PASSWORD: ""
  TDSK_IT_MANUAL_USER_EMAIL: ""
  TDSK_IT_MANUAL_USER_PASSWORD: ""

  # ---- Google Workspace (local tooling) ----
  User: ""
  Password: ""
