apiVersion: v1
kind: Pod
metadata:
  name: kata-smoke
  namespace: default
  labels:
    app: kata-smoke
spec:
  runtimeClassName: kata-clh
  restartPolicy: Never
  containers:
    - name: smoke
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "===== kata-clh smoke test ====="
          echo "scheduled on node: ${NODE_NAME}"
          echo
          echo "--- uname -a ---"
          uname -a
          echo
          echo "--- /proc/version ---"
          cat /proc/version
          echo
          echo "--- /proc/cpuinfo (first 25 lines) ---"
          head -25 /proc/cpuinfo
          echo
          echo "--- /proc/self/mountinfo (first 10 lines) ---"
          head -10 /proc/self/mountinfo
          echo
          echo "--- /dev contents ---"
          ls /dev
          echo
          echo "===== smoke test done ====="
          sleep 600
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
